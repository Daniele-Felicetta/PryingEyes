# The gate on GitHub: the checks that used to run only inside tools/ship.ps1 on one PC (suite boundaries, Python unit tests)
# plus every suite of the studio that needs nothing (the .NET rule labs: `python tools/studio.py suites` lists them), whose reports
# are kept as an artifact. No Unity, no Blender, no secrets: the paths below are everything the gate reads, so the checkout is about
# 20 MiB of files, not the roughly 1.1 GiB the repository tracks. The step "What the checkout downloaded" prints the exact figure of each run.
name: gate

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:

# Read-only: the job reads the repository and uploads its own artifact, nothing else.
permissions:
  contents: read

# A newer run of the same branch (or pull request) supersedes the one still running.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    # Windows on purpose: the production engine owns process trees with Job Objects and its POSIX variant has never been verified.
    # Pinned instead of windows-latest so the OS does not change under the gate by itself.
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      # Sparse + blobless + depth 1. With a sparse-checkout the action already fetches with blob:none; it is spelled out here
      # because the size of this step is part of the design. Non-cone mode: the rules need single files and *.cs globs.
      - name: Checkout (sparse, blobless, depth 1)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Every source a wiki page cites must be in this list, or check_suite fails with WIKI_SOURCE_MISSING: the CI page
          # cites this workflow file, so it is listed here. So is .gitignore: a unit test reads the patterns of the labs' folders.
          sparse-checkout: |
            /tools/
            /README.md
            /AGENTS.md
            /.gitignore
            /.github/workflows/gate.yml
            /docs/
            /wiki/
            /unity/PryingEyes/Packages/
            /unity/PryingEyes/Assets/_PryingEyes/**/*.cs
            /unity/PryingEyes/Assets/_PryingEyes/**/*.asmdef
            /unity/PryingEyes/Assets/_PryingEyes/Resources/Production/*.json
            /unity/PryingEyes/Assets/_PryingEyes/City/citta.json
            /unity/PryingEyes/ProjectSettings/ProjectVersion.txt
            /unity/LayoutDemo/Packages/manifest.json
            /modelli/**/*.py

      - name: What the checkout downloaded
        run: |
          $packs = @(Get-ChildItem .git/objects/pack -Filter *.pack)
          $packMiB = [math]::Round((($packs | Measure-Object Length -Sum).Sum) / 1MB, 2)
          $files = @(Get-ChildItem -Recurse -File -Force | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          $treeMiB = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 2)
          $line = "$($packs.Count) pack file(s) = $packMiB MiB downloaded; working tree: $($files.Count) files, $treeMiB MiB"
          $line
          "### Checkout`n$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          git count-objects -vH

      # Python 3.10.11 is what tools/ and requirements-studio.txt are verified on; it is not preinstalled on the image,
      # setup-python downloads it.
      - name: Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Python requirements
        run: python -m pip install --disable-pip-version-check -r tools/requirements-studio.txt

      # The labs target net8.0: make sure an 8.0 runtime and SDK exist whatever the image keeps. The highest installed SDK
      # (10.x on the image, like on the maintainer's PC) still builds them.
      - name: .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Toolchain versions
        run: |
          python --version
          dotnet --version
          dotnet --list-runtimes
          git --version

      # The cheapest check first: package and engine boundaries, and the documentation (links, index, no machine-specific paths).
      - name: Suite boundaries and documentation
        run: python tools/check_suite.py

      # The shape of the game's code, next to the guard: sizes, cycles between folders, the tests and the flags. It reports and never fails
      # the run (the guard above is what fails); the whole result is kept as code-census.json with the lab reports.
      - name: Code census in the run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force unity_logs/lab-reports | Out-Null
          $census = python tools/code_census.py --section sizes --section cycles --section tests --section flags --json unity_logs/lab-reports/code-census.json
          $census
          $fence = '```'
          "### Code census`n$fence`n$($census -join "`n")`n$fence" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # Every tools/*lab folder is a lab project, compiled here once, so the Python tests that run `dotnet run` (90-120 s limits) do not spend
      # their time restoring and compiling: a new lab needs no line in this workflow. Several native commands in one PowerShell step: only the
      # last exit code would count, so each one is checked.
      - name: Compile the .NET labs
        run: |
          $labs = @(Get-ChildItem tools -Directory -Filter '*lab')
          if ($labs.Count -eq 0) { throw 'There is no tools/*lab folder: the gate would compile nothing.' }
          foreach ($lab in $labs) {
            dotnet build $lab.FullName -c Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "$($labs.Count) labs compiled: $(($labs | ForEach-Object Name) -join ', ')"

      - name: Python unit tests
        run: python -m unittest discover -s tools -p "test_*.py"

      # What the gate runs is whatever the studio lists that needs nothing (no editor, no built player): `suites --json` is the list, in the
      # order of the run and of the summary. A new lab is one entry in the profile and its project under tools/; nothing is named here. Every
      # suite runs even when one fails, so that the summary shows all of them and which failed; the step fails at the end.
      - name: Rule suites (the ones that need nothing)
        run: |
          $listing = python tools/studio.py suites --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suites = @($listing.suites | Where-Object { @($_.needs).Count -eq 0 })
          if ($suites.Count -eq 0) { throw 'The studio lists no suite that needs nothing: the gate would run nothing.' }
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "::group::$($suite.name): $($suite.about)"
            $env:STUDIO_OUTPUT = "unity_logs/lab-reports/$($suite.name)"
            python tools/studio.py test $suite.name
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += $suite.name; Write-Host "::error title=Suite failed::$($suite.name) exited with $code" }
          }
          if ($failed.Count -gt 0) { Write-Host "Failed suites: $($failed -join ', ')"; exit 1 }

      - name: Lab results in the run summary
        if: ${{ !cancelled() }}
        run: |
          $listing = python tools/studio.py suites --json | Out-String | ConvertFrom-Json
          $rows = foreach ($suite in @($listing.suites | Where-Object { @($_.needs).Count -eq 0 })) {
            $found = Get-ChildItem "unity_logs/lab-reports/$($suite.name)" -Recurse -Filter report.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { "| $($suite.name) | no report | | | |"; continue }
            $r = Get-Content $found.FullName -Raw | ConvertFrom-Json
            $passed = @($r.findings | Where-Object { $_.passed }).Count
            $seconds = [int]((@($r.steps | Where-Object { $null -ne $_.seconds } | ForEach-Object { $_.seconds }) | Measure-Object -Sum).Sum)
            "| $($suite.name) | $($r.state) | $passed / $(@($r.findings).Count) | $seconds | $(@($r.sources.PSObject.Properties).Count) |"
          }
          $table = "### Rule labs`n| suite | job state | checks passed | seconds | sources hashed |`n| --- | --- | --- | --- | --- |`n" + ($rows -join "`n")
          $table
          $table | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload the lab reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lab-reports
          path: unity_logs/lab-reports/
          if-no-files-found: warn
